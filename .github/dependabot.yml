# Dependabot für Feed the Floor.
#
# `npm` liest als Ökosystem auch pnpm: es nimmt `package.json` und
# `pnpm-lock.yaml` und zieht die Workspace-Pakete über das Root-Manifest mit.
# `devcontainers` hält die Devcontainer-Features aktuell.
#
# Hinweis: Dependabot-PRs sind kurz und englisch; sie erfüllen die
# Commit-Regeln aus `docs/REGELWERK_GIT.md` nicht und brauchen vor dem Merge
# einen gate-konformen Commit.
#
# `ignore` ist eine Festlegung, keine Vorsicht (D16, `[N-del]` in
# `docs/CONCEPT_REVIEW.md` Abschnitt 0c): Werkzeug-Updates laufen über einen
# eigenen, gemessenen Schnitt und nicht als nebenbei einspielter PR. Vitest
# und Biome sind gepinnt; eine Änderung an ihnen ist ein eigener Block mit
# roten Zeilen gegen das neue Verhalten, nicht ein Merge von heute auf morgen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: vitest
      - dependency-name: @biomejs/biome
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
