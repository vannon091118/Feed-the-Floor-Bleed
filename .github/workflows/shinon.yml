name: Shinon

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shinon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Shinon Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm run -s typecheck
      - name: Test
        run: pnpm test -- --run
      - name: Lint
        run: pnpm run -s lint
      - name: Run hard-fail Shinon suite
        run: pnpm run -s check
