name: Shinon

# Der push-Trigger greift auf `main` unabhängig davon, aus welchem Branch
# gemergt wurde. Jeder Merge nach main löst damit Tests und Deploy-Build aus;
# das Artefakt entsteht nur auf main, die Prüfung läuft auch für Pull Requests.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shinon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Shinon Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit integrity (push auf main)
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: node scripts/shinon/plugins/commit-integrity.mjs --from ${{ github.event.before }}
      - name: Commit integrity (Pull Request)
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/shinon/plugins/commit-integrity.mjs --from ${{ github.event.pull_request.base.sha }}
      - name: Typecheck
        run: pnpm run -s typecheck
      - name: Test
        run: pnpm test -- --run
      - name: Lint
        run: pnpm run -s lint
      - name: Run hard-fail Shinon suite
        run: pnpm run -s check
      - name: Deploy-Build
        run: pnpm --filter @floor/client build
      - name: Deploy-Artefakt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          if-no-files-found: error
          retention-days: 14
