name: Shinon

# Der push-Trigger greift auf `main` unabhängig davon, aus welchem Branch
# gemergt wurde. Jeder Merge nach main löst damit Tests und Deploy-Build aus;
# das Artefakt entsteht nur auf main, die Prüfung läuft auch für Pull Requests.
#
# Dieser Trigger setzt voraus, dass der `promote`-Job NICHT mit dem
# mitgelieferten `GITHUB_TOKEN` schiebt. GitHub startet für Events, die ein
# `GITHUB_TOKEN` ausgelöst hat, bewusst keinen neuen Workflow-Lauf; ein Push
# auf `main` aus `promote` heraus würde den push-Zweig also stumm abschalten.
# Deshalb schiebt `promote` mit dem Secret `PROMOTE_TOKEN` (Fine-grained PAT
# mit `contents: write` auf dieses Repository). Fehlt das Secret, bricht der
# Job sichtbar ab, statt still zugrunde zu fördern.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shinon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Shinon Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit integrity (push auf main)
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: node scripts/shinon/plugins/commit-integrity.mjs --from ${{ github.event.before }}
      - name: Commit integrity (Pull Request)
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/shinon/plugins/commit-integrity.mjs --from ${{ github.event.pull_request.base.sha }}
      - name: Typecheck
        run: pnpm run -s typecheck
      - name: Test
        run: pnpm test -- --run
      - name: Lint
        run: pnpm run -s lint
      - name: Run hard-fail Shinon suite
        run: pnpm run -s check
      - name: Deploy-Build
        run: pnpm --filter @floor/client build
      - name: Deploy-Artefakt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          if-no-files-found: error
          retention-days: 14

  # Derselbe Lauf auf Windows. Die Entwicklerbox ist Windows, und die
  # Kommandozeile dort ist cmd.exe statt /bin/sh — ein Unterschied, der
  # stillschweigend scheitern kann. Das öffentliche Repo kostet dafür nichts,
  # deshalb ist dieses Signal dauerhaft und nicht erforderlich: Es ändert
  # `Shinon Gate` nicht und blockiert nichts.
  gate-windows:
    name: Gate Windows (nur Signal)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit integrity
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/shinon/plugins/commit-integrity.mjs --from ${{ github.event.pull_request.base.sha }}

      - name: Typecheck
        run: pnpm run -s typecheck

      - name: Lint
        run: pnpm run -s lint

      - name: Test
        run: pnpm test -- --run

      - name: Doku- und LOC-Hygiene
        run: node scripts/check-loc.mjs && node scripts/check-hygiene.mjs

  # Shinon erledigt den Rest: Ist der Gate-Job grün, wird der geprüfte
  # PR-Kopf per Fast-Forward nach main geschoben. Das schließt die Lücke,
  # dass main den Status-Check `Shinon Gate` verlangt und ein Direktpush ihn
  # nie auf dem Zielcommit erzeugen kann. Es entsteht kein Merge-Commit; die
  # signierten und geprüften Commits landen unverändert. Blockt ein Gate oder
  # eine Policy (unaufgelöste Kommentare, fehlende Signatur), scheitert dieser
  # Job sichtbar und es landet nichts.
  #
  # Geschoben wird nicht mit `GITHUB_TOKEN`, sondern mit `PROMOTE_TOKEN`.
  # Sonst würde GitHub den push-Zweig nie mehr starten, weil Events aus einem
  # `GITHUB_TOKEN`-Push keine neuen Läufe erzeugen — der Deploy-Pfad auf
  # `main` wäre stumm tot. Das Token kommt als HTTP-Extraheader rein und
  # nicht in die Remote-URL, damit es in keiner Fehlermeldung und in keinem
  # `git`-Output landet.
  promote:
    name: Promote nach main
    needs: gate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Bewusst nur read: Der mitgelieferte GITHUB_TOKEN darf hier gar nicht
      # schreiben können. Der einzige Schreibweg ist PROMOTE_TOKEN.
      contents: read
    steps:
      - name: Checkout PR-Kopf
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Kein persistierter Zugangsschein aus GITHUB_TOKEN: der Push
          # unten nutzt ausschliesslich PROMOTE_TOKEN.
          persist-credentials: false
      - name: Nur Fast-Forward zulassen
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main ist kein Vorfahre des PR-Kopfes; Rebase nötig, kein Force-Push."
            exit 1
          fi
      - name: Nach main schieben
        env:
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          if [ -z "$PROMOTE_TOKEN" ]; then
            echo "::error::Secret PROMOTE_TOKEN fehlt. Ohne eigenes Token wuerde der Push-Zweig auf main nie starten; Promote bricht bewusst ab."
            exit 1
          fi
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PROMOTE_TOKEN" | base64 -w0)"
          git push origin HEAD:main
