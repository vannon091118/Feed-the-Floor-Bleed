<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <title>Was dich erwartet Banner</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="120" fill="url(#bg)" rx="15" ry="15"/>
  <rect width="1000" height="120" fill="none" stroke="#6600ff" stroke-width="4" rx="15" ry="15" filter="url(#neon)"/>
  <text x="500" y="75" font-family="'Courier New', monospace" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" filter="url(#neon)" letter-spacing="4">🩸 WAS DICH ERWARTET</text>
</svg>
