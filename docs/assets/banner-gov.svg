<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <title>Governance Banner</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b0000"/>
      <stop offset="50%" stop-color="#4a0000"/>
      <stop offset="100%" stop-color="#2b0000"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="120" fill="url(#bg)" rx="15" ry="15"/>
  <rect width="1000" height="120" fill="none" stroke="#ff0000" stroke-width="4" rx="15" ry="15" filter="url(#neon)"/>
  <text x="500" y="75" font-family="'Courier New', monospace" font-weight="900" font-size="48" fill="#ff4444" text-anchor="middle" filter="url(#neon)" letter-spacing="4">🛡️ GOVERNANCE : DAS GESETZ</text>
</svg>
